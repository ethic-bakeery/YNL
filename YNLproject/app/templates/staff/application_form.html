{% extends 'app/user_navbar.html' %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white shadow-xl rounded-lg overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 px-6 py-8 text-center">
                <h2 class="text-2xl font-bold text-white">Become a Staff Member</h2>
                <p class="mt-2 text-blue-100">Submit your application for review</p>
            </div>
            
            <form method="post" class="px-6 py-8 space-y-6">
                {% csrf_token %}
                <div class="space-y-4">
                    {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                        <p class="mt-1 text-sm text-red-600">{{ field.errors|join:", " }}</p>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="w-full px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        Submit Application
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    input, textarea, select {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background-color: white;
    }
    
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    textarea {
        min-height: 120px;
    }
</style>
{% endblock %}
