<!DOCTYPE html>
<html>
<head>
    <title>{{ group.name }} Chat</title>
    <style>
        #messages {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            background: #f9f9f9;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background: #e4e6eb;
        }
        .my-message {
            background: #0084ff;
            color: white;
        }
        #status {
            margin-bottom: 10px;
            font-style: italic;
        }
        #message-form {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex-grow: 1;
            padding: 8px;
        }
        #send-button {
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <h1>{{ group.name }} Chat</h1>
    <div id="status">Not connected</div>
    
    <div id="messages"></div>
    
    <div id="message-form">
        <input type="text" id="message-input" placeholder="Type your message">
        <button id="send-button">Send</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/{{ group.id }}/'
            );
            const messagesDiv = document.getElementById('messages');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const statusDiv = document.getElementById('status');
            
            socket.onopen = function(e) {
                console.log('Connection established');
                statusDiv.textContent = 'Connected';
            };
            
            socket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                console.log('Message received:', data);
                
                const messageElement = document.createElement('div');
                messageElement.className = data.sender === "{{ request.user.username }}" ? 'message my-message' : 'message';
                messageElement.innerHTML = `<strong>${data.sender}:</strong> ${data.message} <small>(${new Date(data.timestamp).toLocaleTimeString()})</small>`;
                
                messagesDiv.appendChild(messageElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };
            
            socket.onclose = function(e) {
                console.log('Connection closed');
                statusDiv.textContent = 'Disconnected';
            };
            
            socket.onerror = function(e) {
                console.error('WebSocket error:', e);
                statusDiv.textContent = 'Error: ' + e.message;
            };
            
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message) {
                    socket.send(JSON.stringify({
                        'message': message,
                        'sender': '{{ request.user.username }}',
                        'group_id': '{{ group.id }}'
                    }));
                    messageInput.value = '';
                }
            }
            
            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
