<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/test_group/'
            );
            
            socket.onopen = function(e) {
                console.log('Connection established');
                document.getElementById('status').textContent = 'Connected';
            };
            
            socket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                console.log('Message received:', data);
                const messages = document.getElementById('messages');
                messages.innerHTML += `<p>${data.sender}: ${data.message} (${data.timestamp})</p>`;
            };
            
            socket.onclose = function(e) {
                console.log('Connection closed');
                document.getElementById('status').textContent = 'Disconnected';
            };
            
            socket.onerror = function(e) {
                console.error('WebSocket error:', e);
                document.getElementById('status').textContent = 'Error: ' + e.message;
            };
            
            document.getElementById('send').addEventListener('click', function() {
                const message = document.getElementById('message').value;
                if (message) {
                    socket.send(JSON.stringify({
                        'message': message,
                        'sender': 'test_user'
                    }));
                    document.getElementById('message').value = '';
                }
            });
        });
    </script>
</head>
<body>
    <h1>WebSocket Test</h1>
    <div id="status">Not connected</div>
    
    <div id="messages" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin: 10px 0;"></div>
    
    <input type="text" id="message" placeholder="Type your message">
    <button id="send">Send</button>
</body>
</html>
